name: fix stale version flash once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-version-flash-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove stale placeholder and bump version
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          old = '<div id="version">v12.4</div>'
          new = '<div id="version"></div>'
          if old not in s:
              raise SystemExit('stale v12.4 placeholder not found')
          index.write_text(s.replace(old, new, 1))

          version = Path('src/version.js')
          s = version.read_text()
          s = s.replace("export const VERSION = '16.84';", "export const VERSION = '16.85';", 1)
          old_note = "export const NOTE = 'The Bruiser vehicle display name is now Mr Muscle; internal vehicle IDs and physics are unchanged';"
          new_note = "export const NOTE = 'Removed the old hard-coded v12.4 HTML placeholder so only the real current version appears when the menu loads';"
          if old_note not in s:
              raise SystemExit('expected v16.84 note not found')
          version.write_text(s.replace(old_note, new_note, 1))
          PY
      - name: Run tests
        run: npm test
      - name: Remove helper and commit
        run: |
          rm .github/workflows/fix-version-flash-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/version.js .github/workflows/fix-version-flash-once.yml
          git commit -m "Remove stale initial version placeholder"
          git push