name: Apply final race fixes once

on:
  push:
    paths:
      - '.github/workflows/apply-race-fixes-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/apply-race-fixes.py
      - name: Run tests
        run: npm test
      - name: Commit result and remove audit helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-race-fixes-final.yml .github/workflows/apply-race-fixes-once.yml .github/scripts/apply-race-fixes.py
          git add src/main.js src/soloRacePosition.js src/bootstrap.js src/version.js tests/recent-fixes.test.mjs
          git commit -m "Fix race result edge cases"
          git push
