name: Apply race fixes once

on:
  push:
    paths:
      - '.github/workflows/apply-race-fixes-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 .github/scripts/apply-race-fixes.py
      - name: Run tests
        run: npm test
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-race-fixes.py .github/workflows/apply-race-fixes-once.yml
          git add src/main.js src/soloRacePosition.js src/bootstrap.js src/version.js tests/recent-fixes.test.mjs
          git commit -m "Fix race result edge cases"
          git push

# One-shot helper: it removes itself after a successful tested commit. Retry after whitespace-safe matching.
