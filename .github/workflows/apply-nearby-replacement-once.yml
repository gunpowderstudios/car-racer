name: Apply nearby replacement spawn once

on:
  push:
    paths:
      - '.github/workflows/apply-nearby-replacement-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          git apply --check replacement-near-wreck-v16.78.patch
          git apply replacement-near-wreck-v16.78.patch
      - name: Run tests
        run: npm test
      - name: Commit result and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm replacement-near-wreck-v16.78.patch .github/workflows/apply-nearby-replacement-once.yml
          git add src/derby.js src/version.js
          git commit -m "Respawn rival replacements near wrecks"
          git push
